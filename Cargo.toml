[workspace]
resolver = "2"
members = [
  "rust/crates/dropbridge-protocol",
  "rust/crates/dropbridge-identity",
  "rust/crates/dropbridge-discovery",
  "rust/crates/dropbridge-transfer",
  "rust/crates/dropbridge-network",
  "rust/crates/dropbridge-core",
  "rust/crates/dropbridge-relay",
  "rust/crates/dropbridge-bench",
  "rust/crates/dropbridge-cli",
  "rust/crates/dropbridge-ffi",
  "rust/crates/dropbridge-tray",
  "server/rendezvous",
]
# dropbridge-tray only compiles on Windows targets; keep local/CI-on-Linux
# default builds green by excluding it from the default member set.
default-members = [
  "rust/crates/dropbridge-protocol",
  "rust/crates/dropbridge-identity",
  "rust/crates/dropbridge-discovery",
  "rust/crates/dropbridge-transfer",
  "rust/crates/dropbridge-network",
  "rust/crates/dropbridge-core",
  "rust/crates/dropbridge-relay",
  "rust/crates/dropbridge-bench",
  "rust/crates/dropbridge-cli",
  "rust/crates/dropbridge-ffi",
  "server/rendezvous",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Turpalitto/Bridge"

[workspace.dependencies]
# --- networking ---
iroh = { version = "=1.2.0" }
iroh-relay = { version = "=1.2.0" }
# --- async ---
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "io-util", "fs", "net", "sync", "time", "signal"] }
bytes = "1"
futures-util = "0.3"
# --- serialization / protocol ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
data-encoding = "2"
# --- crypto / integrity ---
blake3 = "1.8"
rand = "0.10"
ed25519-dalek = "2"
# --- storage ---
rusqlite = { version = "0", features = ["bundled"] }
# --- discovery ---
mdns-sd = "0"
# --- cli / ui / misc ---
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
zstd = "0.13"
qrcode = "0.14"
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench-ci]
inherits = "release"
debug = false
strip = true
