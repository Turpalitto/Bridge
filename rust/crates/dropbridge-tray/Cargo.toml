[package]
name = "dropbridge-tray"
description = "Windows tray resident: menu, daemon supervision, drop folders, autostart"
version.workspace = true
edition.workspace = true
license.workspace = true

# Architecture note (docs/WINDOWS.md): the tray is a THIN shell. All
# cryptography, networking and transfer logic lives in the `dropbridge`
# core binary which this tray supervises. This keeps the tray light, keeps
# cross-compilation feasible, and guarantees one code path for security.

[target.'cfg(windows)'.dependencies]
tray-icon = "0.25"
windows-sys = { version = "0.60", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_UI_Shell",
] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
open = "5"

[target.'cfg(not(windows))'.dependencies]
anyhow = { workspace = true }
