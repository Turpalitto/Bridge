[package]
name = "dropbridge-transfer"
description = "Transfer engine: streaming chunked moves, BLAKE3, journal, resume"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dropbridge-protocol = { path = "../dropbridge-protocol" }
tokio = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
data-encoding = { workspace = true }
blake3 = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
zstd = { workspace = true }

# `nix::sys::statvfs` is the Unix free-space probe; on Windows the disk probe
# goes through `GetDiskFreeSpaceExW` instead, so neither crate is pulled into a
# Windows build.
[target.'cfg(unix)'.dependencies]
nix = { version = "0", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
