[package]
name = "dropbridge-ffi"
description = "C-ABI bridge for Flutter (commands/metadata/events only; never file bytes)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
dropbridge-core = { path = "../dropbridge-core" }
dropbridge-protocol = { path = "../dropbridge-protocol" }
serde_json = { workspace = true }
tokio = { workspace = true }
dropbridge-network = { path = "../dropbridge-network" }
anyhow = { workspace = true }
dropbridge-transfer = { path = "../dropbridge-transfer" }

[dev-dependencies]
tempfile = { workspace = true }
