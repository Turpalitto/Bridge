[package]
name = "dropbridge-cli"
description = "Reference CLI: pair, send, receive daemon, status, diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dropbridge"
path = "src/main.rs"

[dependencies]
dropbridge-core = { path = "../dropbridge-core" }
dropbridge-protocol = { path = "../dropbridge-protocol" }
dropbridge-identity = { path = "../dropbridge-identity" }
dropbridge-discovery = { path = "../dropbridge-discovery" }
dropbridge-network = { path = "../dropbridge-network" }
dropbridge-transfer = { path = "../dropbridge-transfer" }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
qrcode = { workspace = true }
data-encoding = { workspace = true }
rand = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Console control events (SetConsoleCtrlHandler) are the only way a Windows
# process is asked to stop politely; the tray uses GenerateConsoleCtrlEvent to
# stop the supervised daemon.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }
